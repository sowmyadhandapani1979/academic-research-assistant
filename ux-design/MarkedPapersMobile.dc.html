<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }

  componentDidMount() {
    const filterBtn = document.getElementById('filter-btn');
    const filterOptions = document.getElementById('filter-options');

    filterBtn.addEventListener('click', () => {
      const isHidden = filterOptions.style.display === 'none';
      filterOptions.style.display = isHidden ? 'flex' : 'none';
      filterBtn.style.background = isHidden ? '#0051D5' : '#007AFF';
    });
  }
}
